// Instala: npm i express cors yt-dlp-exec
// Asegurate de tener yt-dlp y ffmpeg instalados en el sistema
// Ubuntu: sudo apt install yt-dlp ffmpeg

import express from "express";
import cors from "cors";
import youtubedl from "yt-dlp-exec";
import path from "path";
import fs from "fs";
import { randomUUID } from "crypto";

const app = express();
app.use(cors());
app.use(express.json());

const TMP = "/tmp/solartube";
if (!fs.existsSync(TMP)) fs.mkdirSync(TMP, { recursive: true });

app.post("/api/convert", async (req, res) => {
  const { url, format, quality } = req.body; // format: 'mp3'|'mp4', quality: '320kbps'|'1080p' etc
  if (!url) return res.status(400).json({ error: "URL requerida" });

  const id = randomUUID();
  const outTemplate = path.join(TMP, \`\${id}.%(ext)s\`);

  try {
    // Config según formato
    let opts: any = {
      noCheckCertificates: true,
      noWarnings: true,
      preferFreeFormats: true,
      addHeader: ["referer:youtube.com", "user-agent:googlebot"],
      output: outTemplate,
    };

    if (format === "mp3") {
      const bitrate = quality?.replace("kbps","") || "320";
      opts = {
        ...opts,
        extractAudio: true,
        audioFormat: "mp3",
        audioQuality: \`\${bitrate}K\`,
      };
    } else {
      // mp4
      const heightMap: any = { "4K": 2160, "1080p": 1080, "720p": 720, "480p": 480 };
      const h = heightMap[quality] || 1080;
      opts = {
        ...opts,
        format: \`bestvideo[height<=?\${h}][ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best\`,
        mergeOutputFormat: "mp4",
      };
    }

    await youtubedl(url, opts);

    // buscar archivo generado
    const files = fs.readdirSync(TMP).filter(f => f.startsWith(id));
    if (!files.length) throw new Error("No se generó archivo");
    const filePath = path.join(TMP, files[0]);

    res.download(filePath, \`solartube-\${Date.now()}.\${format}\`, () => {
      fs.unlink(filePath, () => {});
    });

  } catch (e:any) {
    console.error(e);
    res.status(500).json({ error: e.message || "Error de conversión" });
  }
});

// Opción B rápida: usar Cobalt API (sin yt-dlp)
