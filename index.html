    /* --- ESTILOS DE TU MENU SUPERIOR NUEVO --- */
    #top-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 9999;
      background: rgba(7, 8, 15, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 10px 16px;
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      transition: transform 0.35s ease;
    }
    #top-nav.hidden-nav {
      transform: translateY(-120%);
    }
    #top-nav a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 14px;
      transition: all 0.2s;
    }
    #top-nav a.primary { background:#2563EB; color:white; }
    #top-nav a.secondary { background: rgba(255,255,255,0.08); color:white; border:1px solid rgba(255,255,255,0.12); }
    #top-nav a:hover { transform: translateY(-2px) scale(1.02); }
    
    /* Para que tu app no quede debajo del menu */
    body { padding-top: 58px; }

  <!-- MENU SUPERIOR CORREGIDO - SE OCULTA AL HACER SCROLL -->
  <nav id="top-nav">
    <a href="./Demo-comercial/" class="primary">🚀 Ver Demo Comercial</a>
    <a href="./manual-anti-estafas/" class="secondary">🛡️ Manual Anti-Estafas para clientes</a>
  </nav>

  <div id="root"></div>

  <script>
    // Lógica para ocultar el menú al scrollear hacia abajo
    let lastScroll = 0;
    const nav = document.getElementById('top-nav');
    window.addEventListener('scroll', () => {
      const currentScroll = window.pageYOffset;
      if (currentScroll > 100) {
        if (currentScroll > lastScroll) {
          // bajando
          nav.classList.add('hidden-nav');
        } else {
          // subiendo
          nav.classList.remove('hidden-nav');
        }
      } else {
        nav.classList.remove('hidden-nav');
      }
      lastScroll = currentScroll;
    });
  </script>
