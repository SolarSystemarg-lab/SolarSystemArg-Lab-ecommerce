:root{
  --bg:#07080F;
  --surface:#0E0F18;
  --surface-2:rgba(255,255,255,.05);
  --line:rgba(255,255,255,.08);
  --text:#F8FAFC;
  --muted:#C3C8DC;
  --violet:#7C3AED;
  --cyan:#00E5FF;
  --emerald:#10B981;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth;
  background:#07080F
}

body{
  margin:0;
  background:#07080F;
  color:var(--text);
  font-family:"Manrope",system-ui,sans-serif;
  overflow-x:clip
}

a{
  color:inherit
}

button{
  font:inherit
}

.app-shell{
  min-height:100vh;
  position:relative;
  padding-top:var(--safe-area-inset-top);
  background:#07080F;
  overflow-x:clip
}

.space-bg{
  position:fixed;
  inset:0;
  z-index:0;
  overflow:hidden;
  background:radial-gradient(ellipse at 50% 38%,#171331 0%,#07080F 46%,#04050A 100%);
  pointer-events:none
}

.nebula{
  position:absolute;
  border-radius:50%;
  filter:blur(70px);
  opacity:.34
}

.nebula-a{
  width:58vw;
  height:58vw;
  left:-18vw;
  top:4%;
  background:#5B21B6
}

.nebula-b{
  width:46vw;
  height:46vw;
  right:-14vw;
  top:28%;
  background:#0E7490
}

.nebula-c{
  width:38vw;
  height:38vw;
  left:28%;
  bottom:-18%;
  background:#312E81;
  opacity:.25
}

.star{
  position:absolute;
  background:#fff;
  border-radius:50%;
  box-shadow:0 0 8px #fff;
  animation:twinkle 3s ease-in-out infinite
}

@keyframes twinkle{
  0%,100%{
    transform:scale(.65);
    opacity:.25
  }

  50%{
    transform:scale(1.25);
    opacity:.95
  }
}

.solar-wrap{
  position:absolute;
  left:50%;
  top:34%;
  width:0;
  height:0;
  opacity:.42
}

.sun{
  position:absolute;
  width:64px;
  height:64px;
  left:-32px;
  top:-32px;
  border-radius:50%;
  background:radial-gradient(circle,#fff 0%,#FEF08A 28%,#FACC15 58%,#F97316 100%);
  box-shadow:0 0 45px 12px rgba(250,204,21,.55),0 0 110px 45px rgba(249,115,22,.22);
  animation:sunPulse 5s ease-in-out infinite
}

.sun-halo{
  position:absolute;
  width:140px;
  height:140px;
  left:-70px;
  top:-70px;
  border-radius:50%;
  border:1px solid rgba(254,240,138,.18)
}

@keyframes sunPulse{
  50%{
    box-shadow:0 0 58px 18px rgba(250,204,21,.68),0 0 130px 55px rgba(249,115,22,.28)
  }
}

.orbit{
  position:absolute;
  left:0;
  top:0;
  transform:translate(-50%,-50%);
  border:1px solid rgba(255,255,255,.09);
  border-radius:50%;
  animation:spin linear infinite
}

.planet-holder{
  position:absolute;
  left:50%;
  top:0;
  transform:translate(-50%,-50%)
}

.planet{
  position:relative;
  border-radius:50%;
  box-shadow:inset -3px -4px 8px rgba(0,0,0,.38)
}

.red-spot{
  position:absolute;
  width:32%;
  height:24%;
  right:16%;
  bottom:24%;
  border-radius:50%;
  background:#DC2626;
  box-shadow:0 0 6px #DC2626
}

.saturn-ring{
  position:absolute;
  width:190%;
  height:34%;
  left:-45%;
  top:33%;
  border:3px solid rgba(251,191,36,.72);
  border-radius:50%;
  transform:rotate(-18deg)
}

@keyframes spin{
  to{
    transform:translate(-50%,-50%) rotate(360deg)
  }
}

.top-nav{
  position:fixed;
  top:var(--safe-area-inset-top);
  left:0;
  right:0;
  z-index:50;
  background:rgba(7,8,15,.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.09);
  padding:10px 16px 9px;
  transition:transform .35s ease
}

.nav-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  flex-wrap:wrap
}

.nav-hidden{
  transform:translateY(-100%)
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
  text-decoration:none;
  min-width:0
}

.brand-mark{
  font-size:28px;
  line-height:1
}

.brand strong{
  display:block;
  font-family:"Space Grotesk",sans-serif;
  font-size:18px;
  line-height:1;
  letter-spacing:-.02em
}

.brand small{
  display:block;
  color:#9EA6C4;
  font-size:9px;
  letter-spacing:.18em;
  margin-top:4px
}

.menu{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  max-width:1180px
}

.menu-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  text-decoration:none;
  border:1px solid;
  border-radius:999px;
  padding:8px 12px;
  font-size:12.5px;
  font-weight:800;
  line-height:1.25;
  transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;
  max-width:100%
}

.menu-btn:hover,.menu-btn:focus-visible{
  transform:translateY(-2px) scale(1.02);
  filter:brightness(1.1);
  box-shadow:0 8px 24px rgba(0,0,0,.35);
  outline:2px solid rgba(255,255,255,.5);
  outline-offset:2px
}

.offer-wrap{
  position:relative;
  display:inline-flex;
  padding-top:13px
}

.offer-badge{
  position:absolute;
  top:0;
  right:8px;
  z-index:3;
  background:#FFE600;
  color:#181100;
  border:1px solid #fff;
  border-radius:999px;
  padding:4px 8px;
  font-size:9px;
  line-height:1;
  font-weight:900;
  letter-spacing:.1em;
  white-space:nowrap;
  box-shadow:0 4px 14px rgba(0,0,0,.45);
  animation:offerBlink 1.4s ease-in-out infinite
}

.offer-btn{
  position:relative;
  overflow:hidden;
  isolation:isolate;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  text-decoration:none;
  border:2px solid rgba(255,255,255,.9);
  border-radius:999px;
  color:#fff;
  font-weight:900;
  line-height:1.25;
  text-shadow:0 1px 6px rgba(0,0,0,.35);
  background:linear-gradient(90deg,#FF2E9A,#7C3AED,#00E5FF,#F59E0B,#FF2E9A);
  background-size:300% 100%;
  animation:offerGradient 4s linear infinite,offerPulse 2.2s ease-in-out infinite;
  cursor:pointer
}

.offer-btn::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(105deg,transparent 32%,rgba(255,255,255,.68) 50%,transparent 68%);
  transform:translateX(-130%);
  animation:offerShine 2s ease-in-out infinite;
  pointer-events:none
}

.offer-btn--nav{
  padding:8px 13px;
  font-size:12.5px
}

.offer-btn--hero{
  padding:15px 25px;
  font-size:clamp(15px,2.4vw,19px)
}

.offer-label{
  display:inline-flex;
  align-items:center;
  gap:6px;
  animation:offerWiggle 3.4s ease-in-out infinite
}

.offer-btn:hover,.offer-btn:focus-visible{
  filter:brightness(1.2) saturate(1.2);
  outline:2px solid rgba(255,255,255,.75);
  outline-offset:3px
}

.hero-offer{
  display:flex;
  justify-content:center;
  margin:18px auto 0
}

@keyframes offerGradient{
  from{
    background-position:0% 0
  }

  to{
    background-position:100% 0
  }
}

@keyframes offerPulse{
  0%,100%{
    transform:scale(1);
    box-shadow:0 0 16px rgba(255,46,154,.55),0 8px 24px rgba(124,58,237,.35)
  }

  50%{
    transform:scale(1.06);
    box-shadow:0 0 30px rgba(255,46,154,.9),0 0 42px rgba(0,229,255,.45),0 12px 30px rgba(0,0,0,.4)
  }
}

@keyframes offerShine{
  0%{
    transform:translateX(-130%)
  }

  55%,100%{
    transform:translateX(130%)
  }
}

@keyframes offerWiggle{
  0%,78%,100%{
    transform:rotate(0)
  }

  80%{
    transform:rotate(-2deg)
  }

  82%{
    transform:rotate(2deg)
  }

  84%{
    transform:rotate(-1deg)
  }

  86%{
    transform:rotate(0)
  }
}

@keyframes offerBlink{
  0%,100%{
    opacity:1;
    transform:scale(1)
  }

  50%{
    opacity:.62;
    transform:scale(.94)
  }
}

.tooltip-bar{
  width:min(1060px,100%);
  min-height:44px;
  margin:10px auto 0;
  background:rgba(9,10,20,.92);
  backdrop-filter:blur(14px);
  border:1px solid rgba(139,92,246,.45);
  border-radius:999px;
  box-shadow:0 0 0 1px rgba(0,229,255,.12),0 12px 35px rgba(0,0,0,.35);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:11px 18px
}

.tip-dot{
  color:var(--cyan);
  font-size:18px;
  flex:0 0 auto
}

.tip-text{
  margin:0;
  text-align:center;
  color:#E9EAF8;
  font-size:13.5px;
  line-height:1.45;
  font-weight:600;
  animation:tipIn .32s ease both
}

@keyframes tipIn{
  from{
    opacity:0;
    transform:translateY(5px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

main{
  position:relative;
  z-index:1;
  padding:188px 20px 0
}

.hero{
  max-width:1120px;
  margin:0 auto;
  text-align:center
}

.eyebrow{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:14px;
  color:#A5B4FC;
  font-size:11px;
  font-weight:800;
  letter-spacing:.14em
}

.eyebrow span:first-child{
  color:#6EE7B7
}

.hero h1{
  font-family:"Space Grotesk",sans-serif;
  font-size:clamp(48px,8vw,96px);
  line-height:.92;
  letter-spacing:-.055em;
  margin:22px 0 8px
}

.hero h1 span{
  background:linear-gradient(90deg,#A78BFA,#00E5FF);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent
}

.hero-sub{
  font-family:"Space Grotesk",sans-serif;
  font-size:clamp(22px,3.4vw,38px);
  font-weight:700;
  margin:0;
  color:#E9EAF8
}

.venture-studio{
  position:relative;
  display:inline-block;
  overflow:hidden;
  isolation:isolate;
  margin-top:4px;
  font-size:clamp(38px,7.2vw,78px);
  line-height:1.02;
  letter-spacing:-.035em;
  animation:venturePulse 2.6s ease-in-out infinite
}

.venture-studio span{
  position:relative;
  display:inline-block;
  background:linear-gradient(90deg,#FF2E9A,#A855F7,#7C3AED,#00E5FF,#F59E0B,#FF2E9A);
  background-size:300% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation:ventureGradient 5s linear infinite;
  filter:drop-shadow(0 0 16px rgba(255,46,154,.55)) drop-shadow(0 0 28px rgba(124,58,237,.45)) drop-shadow(0 0 18px rgba(0,229,255,.28))
}

.venture-studio::after{
  content:"";
  position:absolute;
  inset:-4px;
  background:linear-gradient(105deg,transparent 32%,rgba(255,255,255,.85) 50%,transparent 68%);
  transform:translateX(-130%);
  animation:ventureShine 2.4s ease-in-out infinite;
  pointer-events:none
}

.hero-tagline{
  margin:8px 0 0;
  color:#C3C8DC;
  font-family:"Space Grotesk",sans-serif;
  font-size:clamp(14px,2vw,19px);
  font-weight:600;
  letter-spacing:.01em
}

@keyframes ventureGradient{
  from{
    background-position:0% 0
  }

  to{
    background-position:300% 0
  }
}

@keyframes venturePulse{
  0%,100%{
    transform:scale(1)
  }

  50%{
    transform:scale(1.025)
  }
}

@keyframes ventureShine{
  0%{
    transform:translateX(-130%)
  }

  55%,100%{
    transform:translateX(130%)
  }
}

.bands-btn{
  background:#0B0714!important;
  color:#FCE7F3!important;
  border-color:#F472B6!important;
  box-shadow:0 0 18px rgba(244,114,182,.32)
}

.bands-btn:hover,.bands-btn:focus-visible{
  box-shadow:0 0 26px rgba(244,114,182,.62),0 10px 24px rgba(0,0,0,.35)
}

.social-row{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin:22px auto 0
}

.social-label{
  font-size:13px;
  font-weight:800;
  letter-spacing:.08em;
  color:#C3C8DC
}

.social-pill{
  display:inline-flex;
  align-items:center;
  gap:7px;
  text-decoration:none;
  border:1px solid rgba(255,255,255,.22);
  border-radius:999px;
  background:rgba(5,6,12,.72);
  padding:9px 15px;
  font-size:13px;
  font-weight:800;
  color:#F8FAFC;
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease
}

.social-pill:hover,.social-pill:focus-visible{
  transform:translateY(-2px);
  outline:2px solid rgba(255,255,255,.45);
  outline-offset:2px
}

.social-facebook:hover,.social-facebook:focus-visible{
  border-color:#60A5FA;
  box-shadow:0 0 22px rgba(59,130,246,.65)
}

.social-instagram:hover,.social-instagram:focus-visible{
  border-color:#F472B6;
  box-shadow:0 0 22px rgba(236,72,153,.6),0 0 26px rgba(168,85,247,.35)
}

.social-row--footer{
  margin:0
}

.hero-copy{
  max-width:760px;
  margin:18px auto 28px;
  color:var(--muted);
  font-size:clamp(15px,2vw,18px);
  line-height:1.7
}

.hero-actions{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:12px
}

.cta-primary,.cta-secondary{
  display:inline-flex;
  align-items:center;
  gap:8px;
  text-decoration:none;
  border-radius:999px;
  padding:13px 20px;
  font-weight:800
}

.cta-primary{
  background:linear-gradient(90deg,#7C3AED,#00B8D4);
  color:white;
  box-shadow:0 10px 30px rgba(124,58,237,.35)
}

.cta-secondary{
  border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.06);
  color:white
}

.hero-cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  margin:54px 0 0;
  text-align:left
}

.mini-card,.system-card,.about-panel{
  background:var(--surface);
  background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.025));
  border:1px solid var(--line);
  border-radius:24px;
  padding:24px
}

.mini-icon{
  width:48px;
  height:48px;
  border-radius:14px;
  background:rgba(124,58,237,.22);
  color:#C4B5FD;
  display:grid;
  place-items:center;
  margin-bottom:18px
}

.mini-icon.emerald{
  background:rgba(16,185,129,.18);
  color:#6EE7B7
}

.mini-icon.pink{
  background:rgba(236,72,153,.18);
  color:#F9A8D4
}

.mini-card h2,.system-card h3{
  font-family:"Space Grotesk",sans-serif;
  font-size:21px;
  line-height:1.2;
  margin:0 0 10px
}

.mini-card p,.system-card p{
  color:var(--muted);
  line-height:1.6;
  margin:0;
  font-size:14.5px
}

.mini-card span{
  display:block;
  color:#8E97B8;
  font-size:10px;
  letter-spacing:.14em;
  font-weight:800;
  margin-top:20px
}

.about{
  max-width:1120px;
  margin:92px auto 0;
  scroll-margin-top:180px
}

.about-grid{
  display:grid;
  grid-template-columns:1.25fr .85fr;
  gap:24px;
  align-items:stretch
}

.section-label{
  display:flex;
  align-items:center;
  gap:7px;
  color:#A5B4FC;
  font-size:11px;
  letter-spacing:.16em;
  font-weight:800
}

.about h2,.systems h2{
  font-family:"Space Grotesk",sans-serif;
  font-size:clamp(32px,5vw,52px);
  line-height:1.05;
  letter-spacing:-.03em;
  margin:12px 0 18px
}

.about p{
  color:var(--muted);
  line-height:1.75
}

.about p.lead{
  color:#E8EAF6;
  font-size:18px
}

.about strong{
  color:white
}

.about-panel{
  padding:28px;
  display:flex;
  flex-direction:column
}

.orbit-mini{
  height:120px;
  position:relative;
  border:1px dashed rgba(255,255,255,.16);
  border-radius:50%;
  margin:2px 0 18px;
  overflow:hidden
}

.mini-sun{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  font-size:34px
}

.mini-planet{
  position:absolute;
  color:#A5B4FC
}

.p1{
  left:18%;
  top:22%
}

.p2{
  left:74%;
  top:28%;
  color:#6EE7B7
}

.p3{
  left:62%;
  top:68%;
  color:#F59E0B
}

.about-panel h3{
  font-family:"Space Grotesk",sans-serif;
  font-size:22px;
  margin:0 0 15px
}

.about-panel ul{
  list-style:none;
  padding:0;
  margin:0;
  display:grid;
  gap:11px;
  color:#DCE0F0;
  font-size:14px
}

.about-panel li{
  display:flex;
  gap:10px;
  align-items:center
}

.about-panel li svg{
  color:#A78BFA;
  flex:0 0 auto
}

.about-stat{
  margin-top:auto;
  padding-top:22px;
  border-top:1px solid var(--line);
  display:flex;
  gap:14px;
  align-items:center
}

.about-stat strong{
  font-size:34px;
  color:#67E8F9
}

.about-stat span{
  font-size:13px;
  color:var(--muted);
  line-height:1.5
}

.systems{
  max-width:1120px;
  margin:96px auto 0;
  scroll-margin-top:180px
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:24px
}

.section-head>div{
  max-width:620px
}

.section-head>p{
  max-width:320px;
  color:var(--muted);
  line-height:1.6;
  margin:0
}

.system-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
  margin-top:30px
}

.system-card{
  display:flex;
  flex-direction:column;
  min-height:300px
}

.system-top{
  display:flex;
  justify-content:space-between;
  align-items:start
}

.system-emoji{
  font-size:38px
}

.live{
  font-size:9px;
  letter-spacing:.14em;
  font-weight:800;
  color:#6EE7B7;
  border:1px solid rgba(110,231,183,.3);
  padding:6px 8px;
  border-radius:999px;
  background:rgba(16,185,129,.1)
}

.system-card h3{
  margin-top:18px
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin:20px 0 auto
}

.badges span{
  font-size:11px;
  font-weight:800;
  padding:6px 9px;
  border-radius:999px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.1);
  color:#E5E7F5
}

.demo-btn{
  margin-top:24px;
  align-self:flex-start;
  display:inline-flex;
  align-items:center;
  gap:7px;
  text-decoration:none;
  color:white;
  background:var(--accent);
  background:color-mix(in srgb,var(--accent) 78%,#000);
  border:1px solid var(--accent);
  border-radius:999px;
  padding:11px 16px;
  font-weight:800;
  font-size:14px
}

.payment-note{
  margin:18px 0 0;
  border:1px solid rgba(0,229,255,.18);
  background:rgba(0,229,255,.05);
  border-radius:18px;
  padding:16px 18px;
  display:flex;
  gap:12px;
  align-items:center
}

.payment-note svg{
  color:var(--cyan);
  flex:0 0 auto
}

.payment-note p{
  margin:0;
  color:var(--muted);
  font-size:14px;
  line-height:1.6
}

.payment-note strong{
  color:white
}

footer{
  position:relative;
  z-index:1;
  max-width:1120px;
  margin:92px auto 0;
  border-top:1px solid var(--line);
  padding:28px 0 34px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  flex-wrap:wrap
}

.footer-logo{
  font-family:"Space Grotesk",sans-serif;
  font-weight:700;
  font-size:18px
}

footer p{
  color:#8E97B8;
  margin:5px 0 0;
  font-size:13px
}

.footer-links{
  display:flex;
  gap:20px
}

.footer-links a{
  color:#C3C8DC;
  text-decoration:none;
  font-size:13px;
  font-weight:700
}

@media(max-width:760px){
  .top-nav{
    padding:8px 10px
  }

  .nav-row{
    gap:8px;
    justify-content:space-between
  }

  .brand strong{
    font-size:15px
  }

  .brand small{
    font-size:8px
  }

  .menu{
    justify-content:center;
    gap:6px
  }

  .menu-btn{
    padding:7px 9px;
    font-size:11px
  }

  .tooltip-bar{
    border-radius:18px;
    width:100%;
    min-height:66px;
    padding:10px 13px
  }

  .tip-text{
    font-size:12.5px;
    line-height:1.4
  }

  main{
    padding:296px 14px 0
  }

  .hero-cards{
    grid-template-columns:1fr
  }

  .about-grid,.system-grid{
    grid-template-columns:1fr
  }

  .section-head{
    align-items:start;
    flex-direction:column
  }

  .hero{
    padding-top:8px
  }

  .about,.systems{
    margin-top:68px
  }

  footer{
    padding-left:14px;
    padding-right:14px
  }

  .social-row--footer{
    width:100%;
    justify-content:flex-start
  }
}

@media(max-width:430px){
  .nav-row{
    justify-content:center
  }

  .menu-btn{
    flex:1 1 30%;
    min-width:102px
  }

  main{
    padding-top:356px
  }

  .hero h1{
    font-size:44px
  }

  .venture-studio{
    font-size:36px
  }

  .offer-wrap{
    flex:1 1 30%;
    min-width:102px
  }

  .offer-btn--nav{
    width:100%
  }

  .offer-btn--hero{
    width:min(100%,360px)
  }
}

@media(prefers-color-scheme:dark){
  :root{
    --bg:#07080F;
    --surface:#0E0F18;
    --text:#F8FAFC;
    --muted:#C3C8DC
  }
}

@media(prefers-reduced-motion:reduce){
  *{
    animation:none!important;
    scroll-behavior:auto!important
  }

  .top-nav,.tooltip-bar{
    transition:none
  }
}
